eha-report-uncued-core-claim-schema-rerun = "eha.uncued_core_claim_report:schema_report_app"
eha-report-uncued-core-claim-overnight = "eha.uncued_core_claim_report:app"
eha-verify-uncued-core-claim-overnight = "eha.uncued_core_claim_report:verify_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eha"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
