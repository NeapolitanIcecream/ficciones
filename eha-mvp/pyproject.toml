[project]
name = "eha-mvp"
version = "0.1.0"
description = "Epistemic Hygiene Arena MVP benchmark for polluted synthetic RAG ecosystems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "openai>=2.11.0",
    "pydantic>=2.12.0",
    "rank-bm25>=0.2.2",
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
eha-generate = "eha.generate_corpus:app"
eha-run = "eha.run_eval:app"
eha-report = "eha.report:app"
eha-generate-v2 = "eha.phase2_generate:app"
eha-phase2 = "eha.phase2_run:app"
eha-report-v2 = "eha.phase2_report:app"
eha-generate-2r = "eha.phase2r_generate:app"
eha-phase2r = "eha.phase2r_run:app"
eha-report-2r = "eha.phase2r_report:app"
eha-generate-2s = "eha.phase2s_generate:app"
eha-phase2s = "eha.phase2s_run:app"
eha-report-2s = "eha.phase2s_report:app"
eha-generate-surface-cue = "eha.surface_cue_generate:app"
eha-report-surface-cue = "eha.surface_cue_report:app"
eha-score-surface-cue = "eha.surface_cue_score:app"
eha-review-surface-cue-design = "eha.surface_cue_design_review:app"
eha-validate-surface-cue-design-review = "eha.surface_cue_design_review_validate:app"
eha-plan-external-validity = "eha.external_validity_design:app"
eha-validate-phase2s-support-role = "eha.phase2s_support_role_guard:app"
eha-audit-phase2s-critical-risk = "eha.phase2s_critical_risk_audit:app"
eha-step2-launch-gate = "eha.step2_launch_gate:app"
eha-generate-matrix-v1 = "eha.matrix_generate:app"
eha-matrix-v1 = "eha.matrix_run:app"
eha-report-matrix-v1 = "eha.matrix_report:app"
eha-matrix-v1-1 = "eha.matrix_v11:app"
eha-matrix-paper-pack = "eha.matrix_paper_pack:app"
eha-epistemic-resilience = "eha.epistemic_resilience:app"
eha-audit-epistemic-resilience = "eha.epistemic_resilience_audit:app"
eha-epistemic-validity-pass = "eha.epistemic_validity_pass:app"
eha-epistemic-parse-repair = "eha.epistemic_parse_repair:app"
eha-epistemic-model-preflight = "eha.epistemic_model_preflight:main"
eha-epistemic-frontier-main = "eha.epistemic_frontier_main:app"
eha-generated-lore-audit = "eha.epistemic_generated_lore_audit:app"
eha-step1-release = "eha.epistemic_step1_release:app"
eha-uncued-contract = "eha.uncued_contract:app"
eha-generate-uncued = "eha.uncued_generate:app"
eha-audit-uncued-leakage = "eha.uncued_leakage:app"
eha-score-uncued-baselines = "eha.uncued_baselines:app"
eha-build-uncued-human-review = "eha.uncued_human_review:build_app"
eha-validate-uncued-human-review = "eha.uncued_human_review:validate_app"
eha-run-uncued-pilot = "eha.uncued_run:app"
eha-report-uncued-pilot = "eha.uncued_report:app"
eha-audit-uncued-scorer = "eha.uncued_scorer_audit:app"
eha-package-uncued-phase1 = "eha.uncued_release:package_app"
eha-verify-uncued-phase1 = "eha.uncued_release:verify_app"
eha-plan-uncued-schema-ablation = "eha.uncued_schema_ablation:plan_app"
eha-run-uncued-schema-ablation = "eha.uncued_schema_ablation:run_app"
eha-report-uncued-schema-ablation = "eha.uncued_schema_ablation:report_app"
eha-verify-uncued-schema-ablation = "eha.uncued_schema_ablation:verify_app"
eha-plan-uncued-robustness = "eha.uncued_robustness:plan_app"
eha-run-uncued-robustness = "eha.uncued_robustness:run_app"
eha-report-uncued-robustness = "eha.uncued_robustness:report_app"
eha-verify-uncued-robustness = "eha.uncued_robustness:verify_app"
eha-build-uncued-schema-codex-audit = "eha.uncued_schema_codex_audit:app"
eha-uncued-bootstrap-statistics = "eha.uncued_statistics:app"
eha-uncued-task-examples = "eha.uncued_examples:app"
eha-uncued-failure-decomposition = "eha.uncued_failure_decomposition:app"
eha-uncued-support-ambiguity = "eha.uncued_support_ambiguity:app"
eha-uncued-positive-contract = "eha.uncued_positive_contract:app"
